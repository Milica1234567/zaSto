    <script>
      ;(function (location) {
        if (location.search[1] === '/') {
          var restoredRoute = location.search
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&')
            })
            .join('?')

          window.history.replaceState(
            null,
            '',
            location.pathname.slice(0, -1) + restoredRoute + location.hash,
          )
        }

        if (location.pathname.startsWith('/m/')) {
          document.title = 'Digitalni meni | ZaSto'
          document.querySelector('meta[name="robots"]').setAttribute('content', 'noindex, follow')
          document.querySelector('link[rel="canonical"]').setAttribute('href', 'https://zasto.rs' + location.pathname)
        }
      })(window.location)
    </script>
