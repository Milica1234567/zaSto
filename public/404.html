<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZaSto</title>
    <script>
      ;(function (location) {
        // Keep the repository segment for a GitHub Pages project site.
        var pathSegmentsToKeep = 1
        var projectRoot = location.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/')
        var route = location.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~')
        var query = location.search
          ? '&' + location.search.slice(1).replace(/&/g, '~and~')
          : ''

        location.replace(
          location.origin + projectRoot + '/?/' + route + query + location.hash,
        )
      })(window.location)
    </script>
  </head>
  <body></body>
</html>
