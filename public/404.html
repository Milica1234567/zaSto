<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZaSto</title>
    <script>
      ;(function (location) {
        var route = location.pathname.slice(1).replace(/&/g, '~and~')
        var query = location.search
          ? '&' + location.search.slice(1).replace(/&/g, '~and~')
          : ''

        location.replace(
          location.origin + '/?/' + route + query + location.hash,
        )
      })(window.location)
    </script>
  </head>
  <body></body>
</html>
